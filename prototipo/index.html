const STORE='vitairos_demo_final_v1';
const TIPOS=['Reporte de turno (demostración)','Registro de mantenimiento (demostración)','Inspección operacional (demostración)','Registro documental (demostración)'];
const PROCESOS=['Operación (demostración)','Mantenimiento (demostración)','Seguridad operacional (demostración)','Control documental (demostración)'];
const ESTADOS=['Borrador','En cola','Enviando','Sincronizado','Error'];
const icons={'login':'♙','home':'⌂','new':'＋','files':'▧','review':'✓','queue':'⇅','history':'◷','detail':'☷','settings':'⚙'};
const names={'login':'Ingreso simulado','home':'Panel principal','new':'Nuevo reporte','files':'Adjuntos y vista previa','review':'Revisión y confirmación','queue':'Cola de envíos','history':'Historial','detail':'Detalle y trazabilidad','settings':'Configuración demo'};
const fresh=()=>({reports:[],user:null,online:true,screen:'login',draft:null,editing:null,detail:null,extraction:null,failNext:false});
let state=fresh();try{let saved=JSON.parse(localStorage.getItem(STORE));if(saved){state={...state,...saved,screen:'login',draft:null,detail:null,editing:null};state.reports.forEach(r=>{if(r.status==='Enviando'){r.status='En cola';r.log.push({at:new Date().toISOString(),message:'Envío interrumpido: disponible para reintentar'});}})}}catch(e){}
let toastTimer,modal=null,processing=new Set();
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp=()=>new Date().toISOString(),date=x=>x?new Date(x).toLocaleString('es-CL',{dateStyle:'short',timeStyle:'short'}):'—';
const uid=()=> 'VIT-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
function persist(){try{let copy={...state,draft:null,detail:null,editing:null,screen:'home'};localStorage.setItem(STORE,JSON.stringify(copy));return true}catch(e){alert('No se pudo guardar: el almacenamiento del navegador está lleno. Reduce el tamaño o cantidad de adjuntos.');return false}}
function notify(s){let old=$('.toast');if(old)old.remove();let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),4300)}
function navigate(s){state.screen=s;modal=null;render()}
function label(status){return '<span class="pill '+(status==='Error'?'error':status==='Sincronizado'?'ok':status==='En cola'||status==='Enviando'?'warn':'')+'">'+({'Borrador':'◌','En cola':'◷','Enviando':'↻','Sincronizado':'✓','Error':'!'}[status]||'•')+' '+esc(status)+'</span>'}
function addlog(r,msg){r.log??=[];r.log.push({at:stamp(),message:msg})}
function start(){state.draft={id:uid(),created:stamp(),user:state.user||'Operador demo',type:'',process:'',area:'',shift:'',notes:'',files:[],status:'Borrador',attempts:0,version:1,log:[]};state.editing=null;navigate('new')}
function edit(id){let r=state.reports.find(x=>x.id===id);if(!r||!['Borrador','En cola','Error'].includes(r.status)){notify('Este reporte ya no se puede editar');return}state.draft=structuredClone(r);state.editing=id;navigate('new')}
function getform(){if(!state.draft)return;for(let k of ['type','process','area','shift','notes']){let el=$('[name="'+k+'"]');if(el)state.draft[k]=el.value}}
function newReport(){let d=state.draft;return `<div class="steps"><i class="on"></i><i></i><i></i></div><div class="notice">Catálogos provisionales para demostración. VITAIROS entregará o validará los definitivos.</div><div class="field"><label>Tipo de reporte *</label><select name="type"><option value="">Seleccionar tipo</option>${TIPOS.map(t=>`<option ${d.type===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="field"><label>Proceso asociado *</label><select name="process"><option value="">Seleccionar proceso</option>${PROCESOS.map(t=>`<option ${d.process===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div><div class="two"><div class="field"><label>Área / faena</label><input name="area" maxlength="80" value="${esc(d.area)}" placeholder="Si corresponde"></div><div class="field"><label>Turno</label><select name="shift"><option value="">No aplica</option>${['Día','Noche','Otro'].map(t=>`<option ${d.shift===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="field"><label>Observaciones</label><textarea name="notes" maxlength="600" placeholder="Descripción breve del reporte">${esc(d.notes)}</textarea></div><div class="card"><div class="small"><b>ID automático:</b> <span class="mono">${esc(d.id)}</span></div><div class="small muted">Usuario: ${esc(d.user)} · ${date(d.created)}</div></div><button class="btn block" onclick="nextFiles()">Continuar a adjuntos →</button><button class="btn secondary block" style="margin-top:9px" onclick="saveDraft('Borrador')">Guardar borrador</button>`}
function fileList(d,canRemove=false){return d.files.length?d.files.map((f,i)=>`<div class="file">${f.data?.startsWith('data:image')?`<img alt="Miniatura del adjunto" src="${f.data}">`:`<span class="ico">📄</span>`}<div style="min-width:0;flex:1"><div class="name">${esc(f.name)}</div><div class="tiny muted">${esc(f.type)} · ${(f.size/1048576).toFixed(2)} MB</div><button class="link" onclick="showFile(${i})">Ver archivo</button></div>${canRemove?`<button title="Quitar adjunto" onclick="removeFile(${i})">✕</button>`:''}</div>`).join(''):'<div class="empty"><div class="symbol">▧</div>Sin adjuntos. Agrega al menos uno.</div>'}
function filesScreen(){return `<div class="steps"><i class="on"></i><i class="on"></i><i></i></div><div class="notice">Se admiten imágenes JPG/PNG y PDF, hasta 5 adjuntos de máximo 10 MB cada uno. En esta maqueta los archivos se guardan en el navegador, sujeto a su capacidad.</div><div class="two"><button class="btn secondary" onclick="pick('image/*',true)">📷 Cámara</button><button class="btn secondary" onclick="pick('image/jpeg,image/png',false)">▧ Galería</button></div><button class="btn ghost block" style="margin-top:9px" onclick="pick('application/pdf',false)">📄 Seleccionar PDF</button><input id="picker" type="file" class="hide" onchange="receiveFiles(this)" accept="image/jpeg,image/png,application/pdf"><h3 class="section">Documentos adjuntos (${state.draft.files.length}/5)</h3>${fileList(state.draft,true)}<div class="actions"><button class="btn secondary" onclick="getform();navigate('new')">← Volver</button><button class="btn" onclick="nextReview()">Revisar →</button></div>`}
function reviewScreen(){let d=state.draft;return `<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="card"><div class="row"><b>Resumen del reporte</b>${label('Borrador')}</div><div class="divider"></div><p class="small"><b>Tipo:</b> ${esc(d.type)}</p><p class="small"><b>Proceso:</b> ${esc(d.process)}</p><p class="small"><b>Área:</b> ${esc(d.area||'No aplica')} · <b>Turno:</b> ${esc(d.shift||'No aplica')}</p><p class="small"><b>Usuario:</b> ${esc(d.user)}</p><p class="small"><b>Creación:</b> ${date(d.created)}</p><p class="small"><b>Observaciones:</b> ${esc(d.notes||'Sin observaciones')}</p><p class="small"><b>Adjuntos:</b> ${d.files.length}</p></div>${fileList(d)}<label class="switch"><input id="quality" type="checkbox">Confirmo que los documentos corresponden al reporte y son legibles.</label><div class="actions" style="margin-top:17px"><button class="btn secondary" onclick="navigate('files')">← Corregir</button><button class="btn copper" onclick="confirmQueue()">Guardar en cola</button></div><button class="btn ghost block" style="margin-top:10px" onclick="saveDraft('Borrador')">Guardar como borrador</button>`}
function reportCard(r,actions=true){return `<div class="report"><div class="row"><h4>${esc(r.type||'Reporte sin tipo')}</h4>${label(r.status)}</div><p>${esc(r.id)}</p><p>${esc(r.process||'Sin proceso')} · ${date(r.created)}</p><p>Adjuntos: ${r.files.length} · Intentos: ${r.attempts||0}</p>${actions?`<div class="actions"><button class="btn sm secondary" onclick="detail('${r.id}')">Ver detalle</button>${['Borrador','En cola','Error'].includes(r.status)?`<button class="btn sm ghost" onclick="edit('${r.id}')">Editar</button>`:''}${['En cola','Error'].includes(r.status)?`<button class="btn sm" onclick="send('${r.id}')">${r.status==='Error'?'Reintentar':'Enviar'}</button>`:''}</div>`:''}</div>`}
function homeScreen(){let n=s=>state.reports.filter(r=>r.status===s).length;return `<div class="card hero"><div class="small muted">OPERACIÓN DE TERRENO</div><h3>Hola, ${esc(state.user||'Operador')}</h3><p class="small muted">Captura documental con trazabilidad, incluso sin conexión.</p><button class="btn copper block" onclick="start()">＋ Crear nuevo reporte</button></div><div class="metrics"><div class="metric"><strong>${state.reports.length}</strong><span>Total</span></div><div class="metric"><strong>${n('En cola')+n('Error')}</strong><span>Pendientes</span></div><div class="metric"><strong>${n('Sincronizado')}</strong><span>Sincronizados</span></div></div><h3 class="section">Conectividad de demostración</h3><div class="card"><div class="row"><div>${state.online?'🟢':'🔴'} <b>${state.online?'Conectado':'Sin conexión'}</b><div class="tiny muted">Control de red simulado</div></div><button class="btn sm secondary" onclick="toggleNetwork()">${state.online?'Desconectar':'Reconectar'}</button></div></div><h3 class="section">Últimos reportes</h3>${state.reports.length?state.reports.slice().reverse().slice(0,3).map(r=>reportCard(r)).join(''):'<div class="empty">Todavía no hay reportes. Crea el primero.</div>'}`}
function queueScreen(){let a=state.reports.filter(r=>['Borrador','En cola','Enviando','Error'].includes(r.status));return `<div class="notice ${state.online?'green':'red'}">${state.online?'🟢 Conectividad simulada disponible. Los reportes en cola pueden enviarse.':'🔴 Sin conexión simulada. Los reportes permanecen almacenados localmente.'}</div><div class="actions"><button class="btn secondary" onclick="toggleNetwork()">${state.online?'Simular desconexión':'Recuperar conexión'}</button><button class="btn" onclick="sendAll()" ${!state.online?'disabled':''}>Enviar pendientes</button></div><p class="hint">Demostración: 3 reintentos automáticos con pausas de 5, 15 y 30 segundos; después queda Error y permite reintento manual. Puedes activar “fallar próximo envío” en Configuración.</p>${a.length?a.slice().reverse().map(r=>reportCard(r)).join(''):'<div class="empty"><div class="symbol">✓</div>No hay reportes pendientes.</div>'}`}
function historyScreen(){return `<div class="field"><label>Filtrar historial</label><select id="filter" onchange="renderHistory()"><option value="Todos">Todos los estados</option>${ESTADOS.map(s=>`<option>${s}</option>`).join('')}</select></div><div id="historyList"></div>`}
function renderHistory(){let el=$('#historyList');if(!el)return;let f=$('#filter').value,a=state.reports.filter(r=>f==='Todos'||r.status===f).slice().reverse();el.innerHTML=a.length?a.map(r=>reportCard(r)).join(''):'<div class="empty">No hay reportes para este filtro.</div>'}
function detailScreen(){let r=state.reports.find(r=>r.id===state.detail);if(!r)return '<div class="empty">Selecciona un reporte en Historial.</div>';return `<div class="card"><div class="row"><b>Estado actual</b>${label(r.status)}</div><p class="mono">${esc(r.id)}</p><div class="divider"></div><p class="small"><b>Tipo:</b> ${esc(r.type)}</p><p class="small"><b>Proceso:</b> ${esc(r.process)}</p><p class="small"><b>Área / faena:</b> ${esc(r.area||'No aplica')}</p><p class="small"><b>Turno:</b> ${esc(r.shift||'No aplica')}</p><p class="small"><b>Usuario:</b> ${esc(r.user)}</p><p class="small"><b>Fecha:</b> ${date(r.created)}</p><p class="small"><b>Versión:</b> ${r.version||1} · <b>Intentos:</b> ${r.attempts||0}</p><p class="small"><b>Observaciones:</b> ${esc(r.notes||'Sin observaciones')}</p></div><h3 class="section">Evidencia documental</h3>${r.files.length?fileList(r):'<div class="notice">Referencias de adjuntos liberadas tras sincronización de demostración.</div>'}<h3 class="section">Trazabilidad</h3><div class="card">${(r.log||[]).slice().reverse().map(l=>`<div class="small" style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${date(l.at)}</b><div>${esc(l.message)}</div></div>`).join('')||'<span class="muted small">Sin eventos</span>'}</div><div class="actions">${['Borrador','En cola','Error'].includes(r.status)?`<button class="btn secondary" onclick="edit('${r.id}')">Editar</button>`:''}${['En cola','Error'].includes(r.status)?`<button class="btn" onclick="send('${r.id}')">Reintentar / enviar</button>`:''}${['Borrador','En cola'].includes(r.status)?`<button class="btn danger" onclick="removeReport('${r.id}')">Eliminar</button>`:''}</div><button class="btn ghost block" style="margin-top:10px" onclick="navigate('history')">← Volver al historial</button>`}
function settingsScreen(){return `<div class="card"><h3 style="margin-top:0">Controles para la presentación</h3><p class="small muted">Estos controles no corresponden a un sistema real de VITAIROS.</p><label class="switch"><input type="checkbox" ${state.online?'checked':''} onchange="setNetwork(this.checked)">Conexión simulada disponible</label><div class="divider"></div><label class="switch"><input type="checkbox" ${state.failNext?'checked':''} onchange="state.failNext=this.checked;persist()">Simular error en el próximo envío (3 intentos)</label><div class="divider"></div><button class="btn secondary block" onclick="demoData()">Cargar reportes de ejemplo</button><button class="btn danger block" style="margin-top:9px" onclick="resetDemo()">Restablecer demostración</button></div><div class="notice">La información se conserva en este navegador mediante almacenamiento local. No se envía a servidores. No usar información real o confidencial.</div><button class="btn ghost block" onclick="logout()">Cerrar sesión simulada</button>`}
function loginScreen(){return `<div class="loginbrand"><img src="${LOGO}" alt="Isotipo gráfico de referencia VITAIROS"><h3>VITAIROS Industrial AI</h3><p>Captura de reportes operacionales · MVP académico</p></div><div class="card"><h3 style="margin-top:0">Ingresar a la demostración</h3><div class="field"><label>Usuario ficticio</label><select id="user"><option value="Operador demo">Operador demo</option><option value="Operadora de terreno">Operadora de terreno</option></select></div><p class="hint">Ingreso local simulado. No se utilizan credenciales corporativas.</p><button class="btn block" onclick="login()">Ingresar →</button></div><div class="notice">Prototipo académico DSY1105. Datos, procesos y respuestas de envío son ficticios.</div>`}
function render(){let tabs=['home','new','files','review','queue','history','detail','settings'];let title=names[state.screen]||'VITAIROS';let body=state.screen==='login'?loginScreen():state.screen==='home'?homeScreen():state.screen==='new'&&state.draft?newReport():state.screen==='files'&&state.draft?filesScreen():state.screen==='review'&&state.draft?reviewScreen():state.screen==='queue'?queueScreen():state.screen==='history'?historyScreen():state.screen==='detail'?detailScreen():state.screen==='settings'?settingsScreen():'<div class="empty">Vuelve al inicio para continuar.</div>';
$('#app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><img class="logo" src="${LOGO}" alt="Isotipo VITAIROS de referencia"><div><strong>VITAIROS</strong><small>INDUSTRIAL AI</small></div></div><p class="sub">Maqueta navegable · DSY1105<br>Captura, contexto y trazabilidad documental</p><div class="navlist">${tabs.map(t=>`<button class="nav ${state.screen===t?'active':''}" onclick="${t==='new'?'start()':t==='files'||t==='review'?'navigate(\''+t+'\')':'navigate(\''+t+'\')'}"><span>${icons[t]}</span>${names[t]}</button>`).join('')}</div><button class="nav" onclick="logout()"><span>⇥</span>${state.user?'Cerrar sesión / cambiar operador':'Ir al ingreso'}</button><div class="foot">Identidad visual académica autorizada como referencia.<br>Sin integración con sistemas productivos.<br>Catálogos y documentos sintéticos.</div></aside><main class="stage"><div class="guide"><div class="eyebrow">Prototipo de presentación</div><h1>Reportes operacionales, sin perder el contexto.</h1><p>Recorre la experiencia del operador desde la captura documental hasta la cola de sincronización y el historial.</p><div class="box"><b>Guion sugerido</b><br>1. Ingresar como operador<br>2. Crear y adjuntar evidencia<br>3. Confirmar y guardar<br>4. Simular desconexión<br>5. Reconectar y sincronizar<br>6. Revisar historial y errores</div><div class="box"><b>Alcance de la maqueta</b><br>Almacenamiento local del navegador; envío y conectividad simulados. No es APK ni implementación Kotlin/Room.</div></div><section class="phone"><div class="statusbar"><span>●●● VITAIROS · DEMO</span><span>${state.online?'◉ Online':'◌ Offline'} · 100%</span></div><header class="head"><div class="row"><div><div class="mini">VITAIROS INDUSTRIAL AI</div><h2>${esc(title)}</h2></div><div class="topactions">${state.user?`<button onclick="logout()">Salir</button><button onclick="toggleNetwork()">${state.online?'◉ Red':'◌ Sin red'}</button>`:''}</div></div></header><div class="screen">${body}</div>${state.user?`<nav class="bottom">${['home','new','queue','history','settings'].map(t=>`<button class="${state.screen===t?'on':''}" onclick="${t==='new'?'start()':'navigate(\''+t+'\')'}"><span>${icons[t]}</span>${t==='new'?'Nuevo':t==='home'?'Inicio':t==='queue'?'Cola':t==='history'?'Historial':'Ajustes'}</button>`).join('')}</nav>`:''}</section></main></div>${modal||''}`;
if(state.screen==='history')renderHistory();}
function login(){state.user=$('#user').value;persist();navigate('home');notify('Sesión ficticia iniciada')}
function logout(){state.user=null;state.draft=null;persist();navigate('login')}
function nextFiles(){getform();if(!state.draft.type||!state.draft.process){notify('Selecciona tipo de reporte y proceso asociado');return}navigate('files')}
function nextReview(){if(!state.draft.files.length){notify('Agrega al menos un documento');return}navigate('review')}
function saveDraft(status){getform();let d=state.draft;if(!d)return;d.status=status;let old=state.reports.findIndex(r=>r.id===d.id);addlog(d,status==='Borrador'?'Borrador guardado localmente':'Reporte guardado en cola');if(old<0)state.reports.push(structuredClone(d));else state.reports[old]=structuredClone(d);if(!persist())return;state.draft=null;state.editing=null;navigate(status==='Borrador'?'history':'queue');notify(status==='Borrador'?'Borrador guardado':'Reporte agregado a la cola')}
function confirmQueue(){if(!$('#quality')?.checked){notify('Debes confirmar que los adjuntos son legibles');return}if(!state.draft?.files.length){notify('Se necesita al menos un adjunto');return}saveDraft('En cola')}
function pick(accept,camera){if(state.draft.files.length>=5){notify('Máximo cinco archivos por reporte');return}let el=$('#picker');el.value='';el.accept=accept;if(camera)el.setAttribute('capture','environment');else el.removeAttribute('capture');el.click()}
function receiveFiles(input){let file=input.files?.[0];if(!file)return;if(!['image/jpeg','image/png','application/pdf'].includes(file.type)){notify('Formato no permitido. Usa JPG, PNG o PDF');return}if(!file.size||file.size>10*1048576){notify('Archivo vacío o mayor a 10 MB');return}let reader=new FileReader();reader.onload=()=>{state.draft.files.push({name:file.name,type:file.type,size:file.size,data:reader.result});render();notify('Documento agregado. Revisa su legibilidad.')};reader.onerror=()=>notify('No fue posible leer el archivo');reader.readAsDataURL(file)}
function removeFile(i){state.draft.files.splice(i,1);render()}
function showFile(i){let r=state.draft||state.reports.find(r=>r.id===state.detail),f=r?.files[i];if(!f)return;if(!f.data){notify('El adjunto ya no está disponible en esta demostración');return}let win=window.open('','_blank');if(!win){notify('Permite ventanas emergentes para ver el archivo');return}if(f.type==='application/pdf'){win.document.write('<title>Vista previa PDF</title><iframe style="width:100%;height:100vh;border:0" src="'+f.data+'"></iframe>')}else{win.document.write('<title>Vista previa de imagen</title><img style="max-width:100%;max-height:95vh;display:block;margin:auto" src="'+f.data+'">')}win.document.close()}
function detail(id){state.detail=id;state.draft=null;navigate('detail')}
function removeReport(id){let r=state.reports.find(x=>x.id===id);if(!r||!['Borrador','En cola'].includes(r.status))return;if(!confirm('¿Eliminar el reporte pendiente? Esta acción no se puede deshacer.'))return;state.reports=state.reports.filter(r=>r.id!==id);state.detail=null;persist();navigate('history');notify('Reporte eliminado')}
function setNetwork(v){state.online=v;persist();render();notify(v?'Conexión simulada recuperada':'Modo sin conexión simulado');if(v)sendAll()}
function toggleNetwork(){setNetwork(!state.online)}
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function send(id){let r=state.reports.find(x=>x.id===id);if(!r||!['En cola','Error'].includes(r.status))return;if(!state.online){notify('Sin conexión: el reporte permanece pendiente');return}if(processing.has(id))return;processing.add(id);r.status='Enviando';addlog(r,'Iniciando sincronización mediante API simulada');persist();render();let forced=state.failNext;if(forced){state.failNext=false;persist()}
for(let i=1;i<=3;i++){r.attempts=(r.attempts||0)+1;addlog(r,'Intento '+i+' de 3');persist();render();await wait(650);if(!state.online){r.status='En cola';addlog(r,'Sin conexión durante el envío; pendiente para recuperar conectividad');persist();processing.delete(id);render();notify('Envío interrumpido: queda en cola');return}if(!forced){r.status='Sincronizado';r.synced=stamp();addlog(r,'Recepción confirmada por API mock; identificador '+r.id);persist();processing.delete(id);render();notify('Reporte sincronizado (simulación)');return}addlog(r,'Error simulado de recepción en intento '+i);persist();render();if(i<3){let delay=[5000,15000,30000][i-1];addlog(r,'Próximo intento automático en '+delay/1000+' segundos');persist();await wait(delay)}}r.status='Error';addlog(r,'Tres intentos agotados. Disponible reintento manual');persist();processing.delete(id);render();notify('Error simulado: disponible reintento manual')}
function sendAll(){if(!state.online){notify('Activa la conexión simulada para enviar');return}let a=state.reports.filter(r=>r.status==='En cola');if(!a.length){notify('No hay reportes en cola');return}a.forEach(r=>send(r.id))}
function demoData(){if(!confirm('¿Agregar tres reportes sintéticos para la demostración?'))return;let statuses=['Borrador','En cola','Sincronizado'];statuses.forEach((status,i)=>{let r={id:uid(),created:new Date(Date.now()-(i+1)*3600000).toISOString(),user:state.user||'Operador demo',type:TIPOS[i],process:PROCESOS[i],area:'Área ficticia '+(i+1),shift:'Día',notes:'Documento y datos sintéticos de demostración.',files:[{name:'ejemplo_ficticio.txt',type:'Referencia simulada',size:200,data:null}],status,attempts:status==='Sincronizado'?1:0,version:1,log:[]};addlog(r,'Reporte sintético de demostración creado');if(status==='Sincronizado')addlog(r,'Sincronización simulada completada');state.reports.push(r)});persist();navigate('home');notify('Tres reportes ficticios cargados')}
function resetDemo(){if(!confirm('¿Eliminar todos los reportes y restablecer esta demostración?'))return;localStorage.removeItem(STORE);state=fresh();navigate('login');notify('Demostración restablecida')}
render();
</script></body></html>
